[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-station-validator"
version = "0.1.0"
description = "Human-in-the-loop validation of UK rail station names against NaPTAN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
railvalidator = "railvalidator.cli:main"

[tool.setuptools]
packages = ["railvalidator"]

[tool.pytest.ini_options]
testpaths = ["tests", "railvalidator"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
